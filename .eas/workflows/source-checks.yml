name: Sanad Source Checks

on:
  push:
    branches: ['check/eas-source']

jobs:
  project_check:
    name: Project checks
    environment: development
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run check

  typecheck:
    name: TypeScript check
    needs: [project_check]
    environment: development
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run typecheck

  native_checks:
    name: Native and workflow checks
    needs: [typecheck]
    environment: development
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run native:check
      - run: npm run workflow:check

  ios_prebuild:
    name: iOS prebuild check
    needs: [native_checks]
    environment: development
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run native:ios-preflight
