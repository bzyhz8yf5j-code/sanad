name: Sanad Source Checks

on:
  push:
    branches: ['check/eas-source']

jobs:
  source_checks:
    name: Source, TypeScript and native checks
    environment: development
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run check
      - run: npm run typecheck
      - run: npm run native:check
      - run: npm run workflow:check

  ios_prebuild:
    name: iOS prebuild check
    needs: [source_checks]
    environment: development
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run native:ios-preflight
