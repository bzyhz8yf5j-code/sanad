name: Sanad iOS Device Development

on:
  push:
    branches: ['build/ios-device']

jobs:
  checks:
    name: Source and native checks
    environment: development
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run check
      - run: npm run typecheck
      - run: npm run native:check

  register_device:
    name: Register iPhone for development
    type: apple-device-registration-request

  build_ios_device:
    name: Build iOS Development Client
    needs: [checks, register_device]
    type: build
    params:
      platform: ios
      profile: development
      refresh_ad_hoc_provisioning_profile: true
