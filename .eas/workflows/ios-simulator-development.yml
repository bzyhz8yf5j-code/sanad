name: Sanad iOS Simulator Development

on:
  push:
    branches: ['build/eas-development']

jobs:
  checks:
    name: Source and native checks
    environment: development
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run check
      - run: npm run typecheck
      - run: npm run native:check

  build_ios_simulator:
    name: Build iOS Simulator Development Client
    needs: [checks]
    type: build
    params:
      platform: ios
      profile: development-simulator
