<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نموذج سند التفاعلي</title><style>

.section-title{display:flex;align-items:center;gap:12px;margin:28px 0 16px;position:relative;z-index:2}.section-title h2{margin:0;font-size:27px;color:#fff}.section-title i{width:46px;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

.stepper{display:flex;align-items:center;justify-content:space-between;margin:3px 0 15px;direction:rtl}.step{display:flex;align-items:center;gap:4px;font-size:10px;color:#798da5}.step b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid #526882}.step.on{color:var(--gold2)}.step.on b{background:var(--gold);color:#071523;border-color:var(--gold)}

.btn{width:100%;border:0;border-radius:10px;padding:12px 14px;background:linear-gradient(180deg,#f0c469,#c98b25);color:#061425;font-family:inherit;font-weight:900;font-size:13px;margin-top:10px;text-align:center}.btn.secondary{background:transparent;color:var(--gold2);border:1px solid #b98225}.btn.red{background:transparent;color:#ff7f82;border:1px solid #ae383c}.btn.green{background:linear-gradient(180deg,#51cf91,#208b5e);color:white}
.thumb{height:100px;border-radius:12px;background:linear-gradient(145deg,#5e7489,#1c3855);position:relative;overflow:hidden;border:1px solid #35506b}.thumb:before{content:"";position:absolute;left:12%;right:12%;bottom:0;height:72%;background:linear-gradient(90deg,#1f3145 0 15%,#d9c3a0 15% 29%,#263d52 29% 46%,#c7b28e 46% 61%,#22384d 61% 78%,#d6c0a0 78%);clip-path:polygon(7% 24%,24% 2%,40% 18%,57% 0,96% 22%,100% 100%,0 100%)}.thumb:after{content:"";position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(#183246,#0c1c2b)}
.list{display:flex;flex-direction:column;gap:8px}.item{display:flex;gap:10px;align-items:center;border:1px solid #223d5b;background:#0b1d32;border-radius:11px;padding:9px}.item .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:rgba(217,165,58,.12);color:var(--gold2);font-size:17px}.item .txt{flex:1}.item strong{display:block;font-size:12px}.item small{display:block;color:#8da0b8;font-size:9px}.tag{font-size:9px;padding:4px 7px;border-radius:999px;background:#17364c;color:#9dc1d9}.tag.ok{background:rgba(49,185,122,.18);color:#65dfaa}.tag.warn{background:rgba(228,147,53,.18);color:#f0b866}.tag.bad{background:rgba(234,93,98,.17);color:#ff9095}
.timeline{position:relative;padding-right:18px}.timeline:before{content:"";position:absolute;right:5px;top:6px;bottom:7px;width:2px;background:#29425e}.t{position:relative;margin:10px 0;font-size:11px}.t:before{content:"";position:absolute;right:-17px;top:2px;width:9px;height:9px;border-radius:50%;background:#38526f;border:2px solid #071729}.t.done:before{background:var(--green)}.t.now:before{background:var(--gold)}.t small{display:block;color:#8397af;font-size:9px}

.state-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.state{height:142px;background:#0c2037;border:1px solid #27435f;border-radius:16px;padding:15px;text-align:center}.state .big{font-size:35px;margin-bottom:7px}.state h4{margin:0 0 4px;font-size:15px}.state p{margin:0;color:#93a6ba;font-size:11px;line-height:1.5}
.token{display:flex;gap:12px;align-items:center}.swatch{width:48px;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.12)}
.table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:14px}.table th{text-align:right;color:var(--gold2);padding:7px 12px}.table td{background:#0d2036;border-top:1px solid #243e5c;border-bottom:1px solid #243e5c;padding:10px 12px;color:#dbe5ef}.table td:first-child{border-right:1px solid #243e5c;border-radius:0 10px 10px 0}.table td:last-child{border-left:1px solid #243e5c;border-radius:10px 0 0 10px}.okdot{color:var(--green);font-weight:900}.warndot{color:var(--orange);font-weight:900}.baddot{color:var(--red);font-weight:900}
.flow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.flowbox{min-width:135px;padding:13px 14px;border-radius:14px;background:#0d223b;border:1px solid #2d4967;text-align:center;font-weight:800}.arrow{color:var(--gold2);font-size:24px}
.notes{font-size:15px;line-height:1.8;color:#d8e1ed;margin:0}.notes li{margin-bottom:6px}.small{font-size:12px;color:#94a6ba}

body{min-height:100vh;background:#020a14;padding:18px;display:flex;flex-direction:column;align-items:center}.proto-head{width:min(1200px,100%);display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.switches{display:flex;gap:8px;flex-wrap:wrap}.switches button{font-family:inherit;background:#0d223b;color:#dce5ef;border:1px solid #2a4563;padding:9px 12px;border-radius:10px;cursor:pointer}.switches button.active{background:var(--gold);color:#061425;border-color:var(--gold)}.proto-wrap{width:min(1200px,100%);display:grid;grid-template-columns:280px 1fr;gap:20px}.side{background:#081a2e;border:1px solid #29435f;border-radius:18px;padding:16px;height:fit-content}.side h3{color:var(--gold2)}.side li{margin:9px 0;color:#c9d5e2}.stage{min-height:700px;background:#051321;border:1px solid #2a4563;border-radius:24px;display:flex;align-items:center;justify-content:center;padding:26px}.stage .phone{transform:scale(1.05)}@media(max-width:800px){.proto-wrap{grid-template-columns:1fr}.side{order:2}.stage{min-height:640px}}

.mapbox{height:255px;border-radius:18px;border:1px solid #2b4c6d;background:

 linear-gradient(153deg,transparent 44%,rgba(78,143,232,.28) 45% 47%,transparent 48%),
 repeating-linear-gradient(22deg,rgba(255,255,255,.035) 0 1px,transparent 1px 36px),
 repeating-linear-gradient(112deg,rgba(255,255,255,.03) 0 1px,transparent 1px 42px),
 radial-gradient(circle at 53% 50%,rgba(49,185,122,.28) 0 4px,transparent 5px),
 linear-gradient(145deg,#193b45,#0c253a 60%,#132c3a);position:relative;overflow:hidden}

.mapbox:after{content:"1234";position:absolute;left:43%;top:43%;color:#fff;font-weight:900;font-size:22px;text-shadow:0 2px 8px #000}

 linear-gradient(90deg,transparent 19%,#19d3c2 20% 21%,transparent 22% 48%,#19d3c2 49% 50%,transparent 51%),
 linear-gradient(0deg,transparent 19%,#19d3c2 20% 21%,transparent 22% 48%,#19d3c2 49% 50%,transparent 51%),
 repeating-linear-gradient(0deg,transparent 0 34px,rgba(217,165,58,.75) 35px 37px),
 repeating-linear-gradient(90deg,transparent 0 48px,rgba(78,143,232,.55) 49px 51px);border:2px solid #27c7b7;transform:rotate(-4deg)}
.cadbox:after{content:"DWG 45_1234";position:absolute;right:18px;bottom:14px;color:#f0c469;font-size:14px}
.role{display:flex;gap:12px;align-items:flex-start}.role .ico{width:52px;height:52px;border-radius:16px;background:rgba(217,165,58,.13);border:1px solid rgba(217,165,58,.33);display:grid;place-items:center;font-size:26px;color:var(--gold2);flex:0 0 auto}.role h3{margin:0 0 6px}.role p{font-size:14px}
.matrix{width:100%;border-collapse:collapse;font-size:13px}.matrix th,.matrix td{padding:10px 9px;border:1px solid #284663;text-align:center}.matrix th{color:var(--gold2);background:#0b2038}.matrix td:first-child{text-align:right;color:#fff;font-weight:700}.matrix .yes{color:#62dfa9;font-weight:900}.matrix .limited{color:#f0b866;font-weight:900}.matrix .no{color:#ff858a;font-weight:900}
.layer-list{display:flex;flex-direction:column;gap:9px}.layer{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#0c2138;border:1px solid #264663}.toggle{width:38px;height:21px;border-radius:99px;background:#1c4660;position:relative;margin-right:auto}.toggle:after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#5ce2ac;top:3px;right:3px}.toggle.off{background:#283b4c}.toggle.off:after{right:20px;background:#8fa1b5}
.arch{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.archbox{min-height:126px;padding:15px;border-radius:16px;border:1px solid #2a4867;background:#0c2138;text-align:center}.archbox b{display:block;color:var(--gold2);font-size:17px;margin:8px 0}.archbox p{font-size:12px;color:#aab9ca;line-height:1.5;margin:0}
.mini-map{height:120px;border-radius:12px;background:linear-gradient(145deg,#173f46,#0f2538);position:relative;overflow:hidden;border:1px solid #31536d}.mini-map:before{content:"";position:absolute;left:15%;top:16%;width:65%;height:62%;border:2px solid #53ddd0;transform:rotate(-7deg);clip-path:polygon(7% 4%,90% 0,100% 68%,74% 100%,5% 85%);background:rgba(83,221,208,.1)}.mini-map:after{content:"GPS • 33.309245, 43.796876";position:absolute;bottom:8px;left:8px;right:8px;color:#fff;font-size:9px;background:rgba(0,0,0,.45);padding:5px;border-radius:7px;text-align:center}
</style></head><body>
<div class="proto-head"><div class="brand"><div><div class="logo">سند</div><small>نموذج تفاعلي أولي</small></div></div><div class="switches" id="switches"></div></div>
<div class="proto-wrap"><aside class="side"><h3>التدفق الحالي</h3><ol id="steps"></ol><p class="small">اضغط أزرار «التالي» أو اختر مسارًا من الأعلى. هذا نموذج تسليم تفاعلي يوضح منطق التنقل قبل البرمجة.</p></aside><main class="stage" id="stage"></main></div>
<script>
const flows={
 'الطلبات الجديدة':[
  ['طلب استثمار',`<div class=\"stepper\"><span class=\"step on\"><b>1</b>التفاصيل</span><span class=\"step\"><b>2</b>المستندات</span><span class=\"step\"><b>3</b>المراجعة</span><span class=\"step\"><b>4</b>الإرسال</span></div><div class=\"thumb\"></div><div class=\"field\"><label>الفرصة</label><strong>مشروع مول بغداد الجديد</strong></div><div class=\"field\"><label>المبلغ المقترح</label><strong>5,000,000 د.ع</strong></div><div class=\"field\"><label>مدة الاستثمار</label><strong>36 شهرًا</strong></div><div class=\"btn\">التالي</div>`],['طلب مساهمة',`<div class=\"stepper\"><span class=\"step on\"><b>1</b>المساهمة</span><span class=\"step\"><b>2</b>الوثائق</span><span class=\"step\"><b>3</b>المراجعة</span></div><div class=\"thumb\"></div><div class=\"field\"><label>عدد الأسهم</label><strong>50 سهمًا</strong></div><div class=\"field\"><label>قيمة السهم</label><strong>100,000 د.ع</strong></div><div class=\"field\"><label>الإجمالي</label><strong>5,000,000 د.ع</strong></div><div class=\"btn\">إرسال طلب المساهمة</div>`],['طلب أقساط',`<div class=\"stepper\"><span class=\"step on\"><b>1</b>الخطة</span><span class=\"step\"><b>2</b>الهوية</span><span class=\"step\"><b>3</b>الدفع</span></div><div class=\"thumb\"></div><div class=\"field\"><label>قيمة العقار</label><strong>85,000,000 د.ع</strong></div><div class=\"field\"><label>الدفعة الأولى</label><strong>15%</strong></div><div class=\"field\"><label>المدة</label><strong>60 شهرًا</strong></div><div class=\"btn\">حساب الخطة</div>`],['حجز مجمع',`<div class=\"stepper\"><span class=\"step on\"><b>1</b>الوحدة</span><span class=\"step\"><b>2</b>البيانات</span><span class=\"step\"><b>3</b>التأكيد</span></div><div class=\"thumb\"></div><div class=\"field\"><label>المجمع</label><strong>مجمع الزهور السكني</strong></div><div class=\"field\"><label>الوحدة</label><strong>A-203 | 120 م²</strong></div><div class=\"field\"><label>نوع الحجز</label><strong>شراء</strong></div><div class=\"btn\">حجز الوحدة</div>`],['متابعة الطلب',`<div class=\"pill\">قيد المراجعة</div><div class=\"field\"><label>رقم الطلب</label><strong>INV-2024-00048</strong></div><div class=\"timeline\"><div class=\"t done\">تم استلام الطلب<small>20/05/2024 - 10:30</small></div><div class=\"t now\">قيد المراجعة<small>التدقيق الأولي</small></div><div class=\"t\">مستندات إضافية<small>عند الحاجة</small></div><div class=\"t\">القرار النهائي<small>بانتظار المراجعة</small></div></div><div class=\"btn secondary\">التواصل مع الدعم</div><div class=\"btn red\">إلغاء الطلب</div>`]],
